# Config for test/performance/modzip_memory_test.rb, see that file for what is being measured.

worker_processes 1;
daemon on;
error_log modzip-memory-error.log warn;
pid modzip-memory.pid;

# mod_zip issues #42 and #81 report that file descriptors are held until every subrequest has
# finished. Give the worker plenty of them so an fd shortage cannot be mistaken for a memory
# problem; the test reports the peak fd count separately.
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
}

http {
  access_log off;
  default_type application/octet-stream;
  sendfile on;

  client_body_temp_path client_body_temp;
  proxy_temp_path proxy_temp;

  # Backend: serves the manifest file and flags it for mod_zip. Same shape as the upstream setup in
  # mod_zip's own t/nginx.conf, because mod_zip only rewrites responses that came from an upstream.
  server {
    listen 127.0.0.1:8091;
    server_name localhost;

    location /manifest/ {
      alias manifests/;
      add_header X-Archive-Files zip;
      add_header Content-Disposition "attachment; filename=modzip-memory.zip";
    }
  }

  # Front: mod_zip turns the proxied manifest into a ZIP, pulling every entry from /files/.
  server {
    listen 127.0.0.1:8090;
    server_name localhost;

    location /zip/ {
      proxy_pass http://127.0.0.1:8091/manifest/;
      proxy_pass_request_headers off;
    }

    location /files/ {
      internal;
      alias files/;
    }
  }
}
